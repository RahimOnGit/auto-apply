<!DOCTYPE html>
<html>
<head><title>Job App Sandbox</title></head>
<body>
  <h2>Fake Job Application</h2>
  <form>
    <input type="text" name="firstName" placeholder="First Name"><br><br>
    <input type="text" name="lastName" placeholder="Last Name"><br><br>
    <input type="email" name="email" placeholder="Email"><br><br>
    <input type="text" name="linkedin" placeholder="LinkedIn"><br><br>
    <input type="text" name="portfolio" placeholder="Portfolio"><br><br>
    <label>Resume:</label> <input type="file" name="resume"><br><br>
    <label>Cover Letter:</label> <input type="file" name="coverLetter"><br><br>
    <button type="button" onclick="alert('Submitted!')">Submit Application</button>
  </form>
</body>
</html>
